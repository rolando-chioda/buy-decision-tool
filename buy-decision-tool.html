<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy Decision Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Buy Decision Tool — one file, works everywhere.
   Layout: one centered work column; tabs for the four steps, results as a ranked ledger */
:root{
  --bg:#f5f6f4;--card:#ffffff;--ink:#1c1f1d;--mute:#646b67;--line:#dfe3e0;
  --acc:#2d6a4f;--acc-soft:#e2efe8;--on-acc:#ffffff;
  --ok:#1f8a4c;--ok-soft:#e3f4ea;--warn:#a86400;--warn-soft:#fbf0dc;--bad:#c0392b;--bad-soft:#fbe5e2;
  --gray-soft:#ecefed;--shade:rgba(20,24,22,.45);
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614;--card:#1b201d;--ink:#e8ece9;--mute:#9aa49e;--line:#2f3632;
  --acc:#74c69d;--acc-soft:#1d3229;--on-acc:#0f1a14;
  --ok:#4cc27e;--ok-soft:#173022;--warn:#e6a23c;--warn-soft:#352a14;--bad:#ef6b5b;--bad-soft:#3a1d1a;
  --gray-soft:#252b28;--shade:rgba(0,0,0,.6);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121614;--card:#1b201d;--ink:#e8ece9;--mute:#9aa49e;--line:#2f3632;
  --acc:#74c69d;--acc-soft:#1d3229;--on-acc:#0f1a14;
  --ok:#4cc27e;--ok-soft:#173022;--warn:#e6a23c;--warn-soft:#352a14;--bad:#ef6b5b;--bad-soft:#3a1d1a;
  --gray-soft:#252b28;--shade:rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.hint{display:block;font-size:12px;color:var(--mute);line-height:1.35;font-weight:400;margin-top:2px}
.group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:16px 0 8px}
.checkcell{display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 12px;cursor:pointer}
.subtabs button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.subtabs button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.actions{display:grid;gap:12px}
.action{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.action .btn{min-width:220px}
.action span{flex:1;min-width:200px}
.linkbtn{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.tools label.check{font-size:12px;color:var(--mute)}
.archived{opacity:.85}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools select{width:auto;padding:4px 8px;font-size:13px}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.sync[data-s="saved"] i,.sync[data-s="local"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i,.sync[data-s="offline"] i{background:var(--bad)}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
label.check{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:60px;line-height:1.4}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.name{font-weight:600;font-size:16px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.del{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.derived{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.derived b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.bundle{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:var(--gray-soft);color:var(--mute)}
.b-acc{background:var(--acc-soft);color:var(--acc)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:inherit;font-size:14px;color:inherit}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input[type=number]{width:64px;text-align:right}
.auto{color:var(--mute);font-style:italic}
.bar{height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px}
.quad .q{border-radius:10px;padding:12px;min-height:90px;min-width:0}
.quad .q h3{margin:0 0 2px;font-size:14px}
.quad .q p{margin:0 0 8px;font-size:12px;color:var(--mute)}
.quad .q ul{margin:0;padding-left:18px;font-size:14px}
.quad .ax{font-size:12px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.quad .axv{writing-mode:vertical-rl;transform:rotate(180deg)}
.q1{background:var(--bad-soft)}.q2{background:var(--ok-soft)}.q3{background:var(--warn-soft)}.q4{background:var(--gray-soft)}
.reco{border-left:4px solid var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi .v{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mute)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft);color:var(--ink)}
.empty{text-align:center;padding:32px 16px}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
footer{margin-top:28px;display:flex;flex-direction:column;gap:10px}
#modal{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%}
#modal p{margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:600px){.quad{grid-template-columns:1fr}.quad .ax{display:none}.tools{align-items:flex-start}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Buy Decision Tool</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="tools">
      <select id="lang" aria-label="Language">
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
      <label class="check"><input type="checkbox" id="hints-toggle"> <span data-i18n="hintsToggle"></span></label>
      <div class="sync" id="sync" data-s="loading"><i></i><span></span></div>
    </div>
  </header>
  <div id="banners"></div>
  <nav id="tabs">
    <button id="tab-items" data-tab="items" data-i18n="tab.items"></button>
    <button id="tab-scores" data-tab="scores" data-i18n="tab.scores"></button>
    <button id="tab-results" data-tab="results" data-i18n="tab.results"></button>
    <button id="tab-settings" data-tab="settings" data-i18n="tab.settings"></button>
  </nav>
  <main id="view"></main>
  <footer>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <div class="small mute" id="storage-info"></div>
    <div class="small mute" data-i18n="disclaimer"></div>
  </footer>
</div>
<div id="modal" hidden><div class="box"><p id="modal-msg"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="modal-cancel" data-cancel></button><button class="btn primary" id="modal-ok" data-ok></button></div></div></div>
<div id="toast" hidden></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));
const CURRENCIES = ['EUR', 'USD', 'GBP', 'CHF', 'CAD', 'AUD', 'JPY'];
const money = v => { try { return new Intl.NumberFormat(locale(), {style:'currency', currency:S.currency || 'EUR'}).format(v); } catch (e) { return (+v).toFixed(2); } };
const curSym = () => { try { return new Intl.NumberFormat(locale(), {style:'currency', currency:S.currency || 'EUR'}).formatToParts(0).find(p => p.type === 'currency').value; } catch (e) { return S.currency; } };
const n1 = v => (Math.round(v * 10) / 10).toLocaleString(locale(), {minimumFractionDigits:1, maximumFractionDigits:1});
const fnum = v => v.toLocaleString(locale());
const fmtDate = iso => iso ? new Date(String(iso).length === 10 ? iso + 'T00:00' : iso).toLocaleDateString(locale(), {day:'numeric', month:'short', year:'numeric'}) : '';

const MOSCOW = {M:{label:'Must have', f:1.0}, S:{label:'Should have', f:0.75}, C:{label:'Could have', f:0.5}, W:{label:"Won't have", f:0}};
const QF = {q1:1.2, q2:1.0, q3:0.8, q4:0.6};
const SETTINGS_KEYS = ['budget', 'waitShort', 'waitLong', 'threshold', 'currency', 'criteria', 'lastBackup'];
const defaultSettings = () => ({
  budget: 400, waitShort: 2, waitLong: 30, threshold: 100, currency: 'EUR', lastBackup: null,

    {id:'price', name:t('crit.price'), weight:20, auto:'price'},

    {id:'util', name:t('crit.util'), desc:t('cd.util'), weight:30},

    {id:'dur', name:t('crit.dur'), desc:t('cd.dur'), weight:20},

});
function exampleData() {

const critName = c => c.auto ? t('crit.' + c.auto) : c.name;

const isPostponed = i => i.state === 'snoozed' && !!i.snoozeUntil && i.snoozeUntil > todayISO();
function snoozeDate(n, unit) {
  const d = new Date(); n = Math.max(1, +n || 1);
  if (unit === 'days') d.setDate(d.getDate() + n); else d.setMonth(d.getMonth() + n);
  return isoDay(d);
}

function ask(msg, okLabel) {
  return new Promise(res => {
    const m = document.getElementById('modal');
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('modal-ok').textContent = okLabel || t('confirm');
    document.getElementById('modal-cancel').textContent = t('cancel');

      else if (e.target.closest('[data-cancel]') || e.target === m) { m.hidden = true; res(false); }
    };
  });
}

/* ================= salvataggio ================= */
// Modalità "local": tutto in localStorage. Modalità "claude": database dell'artifact (app/settings + items/<id>).
const LOCAL_KEY = 'bdt:data';
let localTimer = null;
function saveLocal() {
  try {
    const o = {}; SETTINGS_KEYS.forEach(k => o[k] = S[k] ?? null); o.items = S.items;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(o));
    setSync('local');
  } catch (e) { setSync('error'); renderBanners(t('localFail')); }
}
const pending = new Set(), inflight = new Map();
let flushTimer = null;
function bodyFor(path) {
  if (path === 'app/settings') { const o = {}; SETTINGS_KEYS.forEach(k => o[k] = S[k] ?? null); return clone(o); }
  const it = S.items.find(i => i.id === path.split('/')[1]);
  return it ? clone(it) : null;
}
function queueWrite(path, now) {
  if (mode === 'local') { setSync('saving'); clearTimeout(localTimer); localTimer = setTimeout(saveLocal, now ? 0 : 400); return; }
  if (!db) return;
  pending.add(path); setSync('saving');
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, now ? 0 : 700);
}
const busy = path => pending.has(path) || inflight.has(path);
async function writeOne(path) {
  const prev = inflight.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(() => { const b = bodyFor(path); return b ? db.doc(path).set(b) : db.doc(path).delete(); });
  inflight.set(path, p);
  try { await p; } finally { if (inflight.get(path) === p) inflight.delete(path); }
}
async function flush() {
  const paths = [...pending]; pending.clear();
  try {
    await Promise.all(paths.map(writeOne));
    if (!pending.size && !inflight.size) setSync('saved');
  } catch (e) {
    if (e && e.code === 'unavailable') { paths.forEach(p => pending.add(p)); flushTimer = setTimeout(flush, 1500 + Math.random() * 1500); return; }
    setSync('error', e?.code === 'quota_exceeded' ? t('quota') : null);
  }
}

function scheduleRender() { if (editing()) needRender = true; else render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (needRender && !editing()) { needRender = false; render(); } }, 0));

function startLocal(dbFailed) {
  mode = 'local';

  S.items = d.items.map((i, n) => ({notes:'', links:[], scores:{}, created:n + 1, ...i}));
  loaded = true; dbOk = dbFailed ? false : null;
  setSync(dbFailed ? 'offline' : 'local', dbFailed ? t('dbUnavailable') : null);

}
function saveLocalQuiet() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify({...Object.fromEntries(SETTINGS_KEYS.map(k => [k, S[k] ?? null])), items:S.items})); } catch (e) {} }

async function connect() {
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  if (inClaude) { try { db = await window.claude.use('db'); } catch (e) { db = null; } }
  if (!db) { startLocal(inClaude); return; }
  mode = 'claude';
  const timer = setTimeout(() => { if (!loaded) { dbOk = false; renderBanners(); } }, 10000);
  let gotItems = false, gotSettings = false;
  const ready = () => { if (gotItems && gotSettings && !loaded) { loaded = true; dbOk = true; clearTimeout(timer); setSync('saved'); renderAll(); } };

  db.collection('items').onSnapshot(snap => {
    const local = Object.fromEntries(S.items.map(i => [i.id, i]));
    const next = [];
    for (const d of snap.docs) {
      if (busy('items/' + d.id)) { if (local[d.id]) next.push(local[d.id]); }
      else next.push({...clone(d.data()), id:d.id});
    }
    for (const i of S.items) if (busy('items/' + i.id) && !next.some(n => n.id === i.id)) next.push(i);
    next.sort((a, b) => (a.created || 0) - (b.created || 0));
    const changed = JSON.stringify(next) !== JSON.stringify(S.items);
    S.items = next;
    if (!snap.metadata.fromCache) { gotItems = true; if (dbOk === false && loaded) { dbOk = true; renderBanners(); } }
    if (loaded && changed) scheduleRender(); else ready();
  }, () => { dbOk = false; setSync('error', t('connLost')); renderBanners(); });

  db.doc('app/settings').onSnapshot(snap => {
    if (!busy('app/settings') && snap.exists) {
      const d = snap.data(); let changed = false;
      for (const k of SETTINGS_KEYS) if (k in d && JSON.stringify(d[k]) !== JSON.stringify(S[k])) { S[k] = clone(d[k]); changed = true; }
      if (loaded && changed) { scheduleRender(); renderBackupInfo(); }
    }
    if (!snap.metadata.fromCache) gotSettings = true;
    ready();
  }, () => {});

  db.doc('app/backup').onSnapshot(snap => { autoBackup = snap.exists ? snap.data() : null; renderBackupInfo(); renderBanners(); }, () => {});
}

/* ================= calcolo ================= */
function compute() {
  const cpuOf = i => (+i.uses > 0 && +i.life > 0) ? (+i.price || 0) / (+i.uses * +i.life) : null;
  const live = S.items.filter(i => !isArchived(i));
  const active = live.filter(i => i.moscow !== 'W' && !isPostponed(i));
  const range = vals => { const v = vals.filter(x => x != null && isFinite(x)); return v.length ? [Math.min(...v), Math.max(...v)] : [0, 0]; };
  const [pmin, pmax] = range(active.map(i => +i.price || 0));
  const [cmin, cmax] = range(active.map(cpuOf));
  const lin = (v, mn, mx) => v == null ? 1 : mx === mn ? 10 : clamp(1 + 9 * (mx - v) / (mx - mn), 1, 10);
  const totW = S.criteria.reduce((a, c) => a + Math.max(0, +c.weight || 0), 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const per = {};
  for (const i of S.items) {
    const cpu = cpuOf(i);
    const sc = {};
    let sum = 0;
    for (const c of S.criteria) {
      let s;
      if (c.auto === 'price') s = lin(+i.price || 0, pmin, pmax);
      else if (c.auto === 'cpu') s = lin(cpu, cmin, cmax);
      else s = clamp(+(i.scores?.[c.id] ?? 5) || 1, 1, 10);
      sc[c.id] = s;
      sum += s * Math.max(0, +c.weight || 0);
    }
    const matrix = totW ? sum / totW : 0;
    const q = i.urgent && i.important ? 'q1' : i.important ? 'q2' : i.urgent ? 'q3' : 'q4';
    const mF = MOSCOW[i.moscow]?.f ?? 0.5;
    const final = matrix * mF * QF[q];
    const waitDays = (+i.price || 0) >= (+S.threshold || 0) ? (+S.waitLong || 0) : (+S.waitShort || 0);
    const added = i.added ? new Date(i.added + 'T00:00') : today;
    const waitLeft = Math.max(0, Math.ceil((added.getTime() + waitDays * DAY - today.getTime()) / DAY));
    const snoozeLeft = i.state === 'snoozed' && i.snoozeUntil ? Math.max(0, Math.ceil((new Date(i.snoozeUntil + 'T00:00').getTime() - today.getTime()) / DAY)) : 0;
    const remaining = Math.max(waitLeft, snoozeLeft);
    per[i.id] = {cpu, sc, matrix, q, mF, final, waitDays, remaining, snoozed:snoozeLeft > 0 && snoozeLeft >= waitLeft};
  }

  const activeIds = new Set(active.map(i => i.id));
  const byId = Object.fromEntries(S.items.map(i => [i.id, i]));
  for (const i of active) {
    if (per[i.id].group) continue;
    const group = [], stack = [i.id], seen = new Set([i.id]);
    while (stack.length) {
      const id = stack.pop(); group.push(id);
      for (const o of byId[id].links || []) if (activeIds.has(o) && !seen.has(o)) { seen.add(o); stack.push(o); }
    }
    for (const id of group) per[id].group = group;
  }
  for (const i of S.items) if (!per[i.id].group) per[i.id].group = [i.id];

  const ranked = active.slice().sort((a, b) => per[b.id].final - per[a.id].final);
  const priceOf = id => +byId[id].price || 0;
  let spent = 0;
  const budget = +S.budget || 0;
  const done = new Set(), bundles = [];
  for (const i of ranked) {
    if (done.has(i.id)) continue;
    const g = per[i.id].group;
    g.forEach(id => done.add(id));
    const total = g.reduce((a, id) => a + priceOf(id), 0);
    let st;
    if (g.some(id => per[id].remaining > 0)) st = 'wait';
    else if (spent + total <= budget) { st = 'buy'; spent += total; }
    else st = 'over';
    g.forEach(id => per[id].status = st);
    if (g.length > 1) bundles.push({ids:g.slice().sort((a, b) => per[b].final - per[a].final), total, status:st});
  }
  for (const i of live) if (isPostponed(i)) per[i.id].status = 'postponed';
  for (const i of live) if (i.moscow === 'W') per[i.id].status = 'excluded';
  for (const i of S.items) if (isArchived(i)) per[i.id].status = 'archived';
  const postponed = live.filter(i => isPostponed(i) && i.moscow !== 'W').sort((a, b) => a.snoozeUntil < b.snoozeUntil ? -1 : 1);
  return {per, ranked, bundles, byId, live, postponed, excluded:live.filter(i => i.moscow === 'W'), spent, budget, totW};
}

  const head = S.criteria.map(c => `<th class="num" title="${esc(critDesc(c))}">${esc(critName(c))}<br><span class="mute">${pct(c, D)}%</span></th>`).join('');

function viewResults(D) {

        ${p.group.length > 1 ? `<br><span class="small" style="color:var(--acc)">🔗 ${t('with')} ${p.group.filter(id => id !== i.id).map(nameOf).join(', ')}</span>` : ''}
        ${i.notes ? `<div class="small mute note" style="margin-top:4px">${esc(i.notes)}</div>` : ''}</td>
      <td class="num">${money(+i.price || 0)}</td>
      <td class="num">${cpuText(p)}</td>
      <td style="min-width:150px"><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${100 * p.final / max}%"></i></div><b class="num">${n1(p.final)}</b></div>
        <span class="small mute">${n1(p.matrix)} × ${fnum(p.mF)} × ${fnum(QF[p.q])}</span></td>
      <td>${statusBadge(p.status)}${p.status === 'wait' ? `<br><span class="small mute">${p.snoozed ? t('snoozedUntil', fmtDate(i.snoozeUntil)) : p.remaining > 0 ? t('daysLeft', p.remaining) : t('waitsBundle')}</span>` : ''}</td>

  const list = q => {

    return its.length ? `<ul>${its.map(i => `<li>${esc(i.name)}${i.moscow === 'W' ? ` <span class="mute">(${t('excludedBadge')})</span>` : ''}</li>`).join('')}</ul>` : '<p>—</p>';

  return `${reco}${kpis}
  <div class="card"><h2>${t('rankTitle')}</h2>
    <div class="tablewrap"><table>
      <thead><tr><th class="num">#</th><th>${t('thItem')}</th><th class="num">${t('thPrice')}</th><th class="num">${t('thCpu')}</th><th>${t('thFinal')}<br><span class="mute">${t('thFinalSub')}</span></th><th>${t('thStatus')}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="mute">${t('noActive')}</td></tr>`}</tbody>
    </table></div>
    ${D.excluded.length ? `<p class="small mute" style="margin:12px 0 0">${t('excludedList')} ${D.excluded.map(i => esc(i.name)).join(', ')}</p>` : ''}
  </div>

    <p class="small mute" style="margin-top:0">${t('postponedHelp')}</p>
    ${D.postponed.map(i => `<div class="bundle spread">
      <span style="min-width:0"><b>${esc(i.name) || t('unnamed')}</b> · ${money(+i.price || 0)}</span>
      <span class="badge b-warn">${t('backOn', fmtDate(i.snoozeUntil))}</span>
    </div>`).join('')}
  </div>` : ''}
  ${D.bundles.length ? `<div class="card"><h2>${t('bundlesTitle')}</h2>
    ${D.bundles.map(b => `<div class="bundle">
      <div class="spread"><span style="min-width:0">${b.ids.map(nameOf).join(' + ')}</span><span class="row"><b>${money(b.total)}</b>${statusBadge(b.status)}</span></div>
    </div>`).join('')}
    <p class="small mute" style="margin:10px 0 0">${t('bundlesHelp')}</p>
  </div>` : ''}
  <div class="card"><h2>${t('eisTitle')}</h2>
    <div class="quad">
      <div></div><div class="ax">${t('axUrgent')}</div><div class="ax">${t('axNotUrgent')}</div>
      <div class="ax"><span class="axv">${t('axImp')}</span></div>${qbox('q1')}${qbox('q2')}
      <div class="ax"><span class="axv">${t('axNotImp')}</span></div>${qbox('q3')}${qbox('q4')}
    </div>
  </div>
  <p class="small"><button class="linkbtn" data-act="goHow">${t('howLink')}</button></p>`;
}

/* ================= render ================= */
const VIEWS = {items:viewItems, scores:viewScores, results:viewResults, settings:viewSettings};
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const v = document.getElementById('view');
  if (!loaded) { v.innerHTML = `<div class="card empty"><p class="mute">${t('loadingItems')}</p></div>`; return; }
  v.innerHTML = VIEWS[tab](compute());
}
function renderStatic() {
  document.documentElement.lang = lang;
  document.getElementById('lang').value = lang;
  document.getElementById('hints-toggle').checked = showHints;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  setSync(syncState, syncMsg);
  document.getElementById('storage-info').textContent = mode ? t('storage.' + mode) : '';
}
function renderAll() { renderStatic(); renderBanners(); renderBackupInfo(); render(); }
function refreshDerived() {
  if (tab === 'results') { render(); return; }
  const D = compute();
  const map = {};
  for (const i of S.items) {
    const p = D.per[i.id];
    map[`${i.id}:cpu`] = cpuText(p);
    map[`${i.id}:quad`] = t(p.q + '.l');
    map[`${i.id}:wait`] = waitText(p, i);
    map[`${i.id}:until`] = t('snoozedUntil', fmtDate(i.snoozeUntil));
    map[`${i.id}:matrix`] = n1(p.matrix);
    for (const c of S.criteria) map[`${i.id}:sc:${c.id}`] = n1(p.sc[c.id]);
  }
  for (const c of S.criteria) map[`crit:${c.id}:pct`] = pct(c, D) + '%';
  document.querySelectorAll('[data-d]').forEach(el => { if (el.dataset.d in map) el.textContent = map[el.dataset.d]; });
}
function renderBackupInfo() {
  const el = document.getElementById('backup-info');
  if (el) el.textContent = backupInfoText();
}
function renderBanners(extra) {
  const b = [];
  if (extra) b.push(`<div class="banner bad">${esc(extra)}</div>`);
  if (dbOk === false) b.push(`<div class="banner bad">${t('dbDown')}</div>`);
  if (loaded && dbOk !== false && S.items.length) {
    const last = [S.lastBackup, autoBackup?.last].filter(Boolean).map(d => new Date(d).getTime());
    const age = last.length ? Math.floor((Date.now() - Math.max(...last)) / DAY) : null;
    if (age === null || age > 8) b.push(`<div class="banner warn spread"><span>${age === null ? t('noBackup') : t('oldBackup', age)}</span><button class="btn" id="banner-export" data-act="export">${t('btn.export')}</button></div>`);
  }
  document.getElementById('banners').innerHTML = b.join('');
}

/* ================= eventi ================= */
const NUM = new Set(['price', 'uses', 'life', 'weight', 'budget', 'threshold', 'waitShort', 'waitLong', 'snoozeN']);
function onEdit(e) {
  const k = e.target.dataset.k; if (!k || !loaded) return;
  const [kind, id, field] = k.split(':');
  const el = e.target;
  const val = el.type === 'checkbox' ? el.checked : (NUM.has(field) || NUM.has(id)) ? (el.value === '' ? '' : +el.value) : el.value;
  if (kind === 'item') {
    const i = S.items.find(x => x.id === id); if (!i) return;
    i[field] = val;
    if (['state', 'snoozeN', 'snoozeUnit'].includes(field)) {
      if (i.state === 'snoozed') { i.snoozeN = Math.max(1, +i.snoozeN || 1); i.snoozeUnit = i.snoozeUnit || 'months'; i.snoozeUntil = snoozeDate(i.snoozeN, i.snoozeUnit); }
      else i.snoozeUntil = null;
      if (field === 'state') { i.closedAt = isArchived(i) ? todayISO() : null; queueWrite('items/' + id, true); render(); return; }
    }
    queueWrite('items/' + id);
  }
  else if (kind === 'crit') { const c = S.criteria.find(x => x.id === id); if (!c) return; c[field] = val; queueWrite('app/settings'); }
  else if (kind === 'score') { const i = S.items.find(x => x.id === id); if (!i) return; i.scores = i.scores || {}; i.scores[field] = el.value === '' ? 5 : clamp(+el.value, 1, 10); queueWrite('items/' + id); }
  else if (kind === 'set') { S[id] = val; queueWrite('app/settings'); if (id === 'currency') { render(); return; } }
  refreshDerived();
}
document.addEventListener('input', e => { if (e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') onEdit(e); });
document.addEventListener('change', e => { if (e.target.type === 'checkbox' || (e.target.tagName === 'SELECT' && e.target.id !== 'lang')) onEdit(e); });

document.getElementById('lang').addEventListener('change', e => {
  lang = e.target.value; try { localStorage.setItem('bdt:lang', lang); } catch (err) {}
  needRender = false; renderAll();
});
document.getElementById('hints-toggle').addEventListener('change', e => {
  showHints = e.target.checked; try { localStorage.setItem('bdt:hints', showHints ? '1' : '0'); } catch (err) {}
  needRender = false; render();
});
document.getElementById('view').addEventListener('click', e => {
  const s = e.target.closest('[data-sub]')?.dataset.sub; if (!s) return;
  sub = s; try { localStorage.setItem('bdt:sub', sub); } catch (err) {}
  needRender = false; render();
});
document.getElementById('tabs').addEventListener('click', e => {
  const tb = e.target.closest('button')?.dataset.tab; if (!tb) return;
  tab = tb; try { localStorage.setItem('bdt:tab', tab); } catch (err) {}
  needRender = false; render();
});

async function replaceAll(d) {
  const oldIds = S.items.map(i => i.id);
  const def = defaultSettings();
  SETTINGS_KEYS.forEach(k => { if (k !== 'lastBackup') S[k] = clone(d[k] ?? def[k]); });
  S.items = (d.items || []).map((i, n) => ({notes:'', links:[], scores:{}, ...clone(i), id:String(i.id || '').replace(/[^A-Za-z0-9_\-]/g, '') || uid(), created:i.created || Date.now() + n}));
  renderAll();
  if (mode === 'local') { saveLocal(); return; }
  if (!db) return;
  oldIds.forEach(id => pending.add('items/' + id));
  S.items.forEach(i => pending.add('items/' + i.id));
  pending.add('app/settings');
  setSync('saving'); clearTimeout(flushTimer);
  await flush();
}

async function exportBackup() {
  const data = {exportedAt:new Date().toISOString()};
  SETTINGS_KEYS.forEach(k => data[k] = S[k]);
  data.items = S.items;
  const json = JSON.stringify(data, null, 2), filename = `buy-decision-backup-${todayISO()}.json`;
  if (mode === 'claude') {
    const dl = await window.claude.use('downloads');
    if (!dl) { toast(t('tDlFail')); return false; }
    try { await dl.save({filename, data:json}); }
    catch (err) { if (err?.code !== 'declined') toast(t('tDlFail')); return false; }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  return true;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || !loaded) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'addItem') {
    const it = {id:uid(), name:'', price:0, moscow:'S', urgent:false, important:true, uses:4, life:24, added:todayISO(), scores:{}, notes:'', links:[], created:Date.now()};
    S.items.push(it);
    if (tab !== 'items') { tab = 'items'; try { localStorage.setItem('bdt:tab', tab); } catch (err) {} }
    queueWrite('items/' + it.id, true); render();
    document.getElementById('name-' + it.id)?.focus();
  } else if (act === 'delItem') {
    const i = S.items.find(x => x.id === id);
    if (!await ask(t('askDel', i?.name || t('unnamed')), t('okDel'))) return;
    for (const x of S.items) if ((x.links || []).includes(id)) { x.links = x.links.filter(l => l !== id); queueWrite('items/' + x.id, true); }
    S.items = S.items.filter(x => x.id !== id);
    queueWrite('items/' + id, true); render();
  } else if (act === 'toggleLink') {
    const a = S.items.find(x => x.id === id), o = S.items.find(x => x.id === b.dataset.other);
    if (!a || !o) return;
    a.links = a.links || []; o.links = o.links || [];
    if (a.links.includes(o.id)) { a.links = a.links.filter(l => l !== o.id); o.links = o.links.filter(l => l !== a.id); }
    else { a.links.push(o.id); o.links.push(a.id); }
    queueWrite('items/' + a.id, true); queueWrite('items/' + o.id, true); render();
  } else if (act === 'addCrit') {
    S.criteria.push({id:uid(), name:t('newCrit'), weight:10}); queueWrite('app/settings', true); render();
  } else if (act === 'addAuto') {
    S.criteria.unshift({id:b.dataset.auto, name:t('crit.' + b.dataset.auto), weight:15, auto:b.dataset.auto}); queueWrite('app/settings', true); render();
  } else if (act === 'delCrit') {
    S.criteria = S.criteria.filter(x => x.id !== id); queueWrite('app/settings', true); render();
  } else if (act === 'clear') {
    if (!await ask(t('askClear'), t('okClear'))) return;
    await replaceAll({...defaultSettings(), items:[]}); toast(t('tCleared'));
  } else if (act === 'example') {
    if (S.items.length && !await ask(t('askExample'), t('okExample'))) return;
    await replaceAll(exampleData()); toast(t('tExample'));
  } else if (act === 'export') {
    if (await exportBackup()) {
      S.lastBackup = new Date().toISOString(); queueWrite('app/settings', true);
      renderBackupInfo(); renderBanners(); toast(t('tDlOk'));
    }
  } else if (act === 'import') {
    document.getElementById('file').click();
  } else if (act === 'restore') {
    const i = S.items.find(x => x.id === id); if (!i) return;
    i.state = 'active'; i.closedAt = null; i.snoozeUntil = null;
    queueWrite('items/' + id, true); render();
  } else if (act === 'goHow') {
    tab = 'settings'; sub = 'how';
    try { localStorage.setItem('bdt:tab', tab); localStorage.setItem('bdt:sub', sub); } catch (err) {}
    render(); window.scrollTo(0, 0);
  }
});
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.criteria)) throw new Error(t('badFile'));
    if (!await ask(t('askImport', d.items.length, f.name), t('okImport'))) return;
    await replaceAll(d); toast(t('tImported', d.items.length));
  } catch (err) { toast(t('tImportFail') + err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) document.getElementById('modal-cancel').click(); });

renderAll();
connect();
</script>
</body>
</html>
